<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Pattern & Syllabus — UNLOST</title>
  <meta name="description" content="Verified examination details, paper pattern, syllabus, and official preparation guidelines.">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="/src/firebase-init.ts"></script>
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./index.html" class="unlost-logo">
          <span class="un">UN</span><span class="lost">LOST</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="./index.html" class="nav-link">Home</a></li>
            <li><a href="./career-explorer.html" class="nav-link">Explore Careers</a></li>
            <li><a href="./roadmaps.html" class="nav-link">Roadmaps</a></li>
            <li><a href="./skill-development.html" class="nav-link">Skills</a></li>
            <li><a href="./colleges.html" class="nav-link">Colleges</a></li>
            <li><a href="./entrance-exams.html" class="nav-link active">Exams</a></li>
            <li><a href="./scholarships.html" class="nav-link">Scholarships</a></li>
            <li><a href="./about.html" class="nav-link">About</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-actions">
        <a href="./login.html" class="btn btn-ghost btn-sm">Login</a>
        <a href="./register.html" class="btn btn-primary btn-sm">Get Started</a>
        <button class="menu-toggle" aria-label="Toggle Navigation">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main style="padding: 4rem 0 6rem;">
    <div class="container" id="exam-details-content">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 UNLOST. Not lost. Just finding my way.</div>
        <div><a href="./entrance-exams.html" style="color:var(--silver-metallic); text-decoration:underline;">Back to Entrance Exams</a></div>
      </div>
    </div>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'jee-advanced';
      const exam = window.UNLOST_DATA.entranceExams.find(e => e.id === id) || window.UNLOST_DATA.entranceExams[0];
      const isSaved = window.UnlostApp.isSaved('exams', exam.id);

      document.title = `${exam.name} — UNLOST Examination Hub`;
      const container = document.getElementById('exam-details-content');

      container.innerHTML = `
        <div style="margin-bottom: 2.5rem;">
          <a href="./entrance-exams.html" style="color:var(--text-muted); font-size:0.85rem; display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to Exams
          </a>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1.5rem;">
            <div>
              <span class="tag tag-silver" style="margin-bottom:0.5rem;">${exam.governingBody}</span>
              <h1 class="section-title" style="margin-bottom:0.5rem;">${exam.name}</h1>
              <p class="section-subtitle">${exam.targetPrograms}</p>
            </div>
            <div style="display:flex; gap:0.75rem;">
              <button onclick="toggleSaveExam('${exam.id}', this)" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${isSaved ? 'white' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                ${isSaved ? 'Saved to Tracker' : 'Save Exam'}
              </button>
              <a href="${exam.officialUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Official Examination Site ↗
              </a>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:2rem;">
          <div style="display:flex; flex-direction:column; gap:2rem;">
            <div class="charcoal-card">
              <h3 class="card-title">Exam Structure & Pattern</h3>
              <p style="color:var(--text-primary); font-size:0.95rem; line-height:1.6; margin-top:0.75rem;">
                ${exam.examPattern}
              </p>
            </div>

            <div class="charcoal-card">
              <h3 class="card-title">Syllabus Overview</h3>
              <p style="color:var(--text-primary); font-size:0.95rem; line-height:1.6; margin-top:0.75rem;">
                ${exam.syllabus}
              </p>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:2rem;">
            <div class="charcoal-card">
              <h3 class="card-title">Eligibility Criteria</h3>
              <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.5; margin-top:0.75rem;">
                ${exam.eligibility}
              </p>
            </div>

            <div class="charcoal-card">
              <h3 class="card-title">Schedule & Verification</h3>
              <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.5; margin-top:0.75rem;">
                ${exam.datesNote}
              </p>
              <div style="margin-top:1rem; padding:0.75rem; background:var(--bg-pitch); border-radius:var(--radius-md); font-size:0.8rem; color:var(--silver-metallic);">
                ℹ️ Always verify exact registration cutoff dates on the official authority portal.
              </div>
            </div>
          </div>
        </div>
      `;

      window.toggleSaveExam = (eid, btn) => {
        const isNowSaved = window.UnlostApp.toggleBookmark('exams', eid);
        const svg = btn.querySelector('svg');
        if (svg) svg.setAttribute('fill', isNowSaved ? 'white' : 'none');
        btn.textContent = isNowSaved ? 'Saved to Tracker' : 'Save Exam';
      };
    });
  </script>
</body>
</html>

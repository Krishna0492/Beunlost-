<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — UNLOST Student Platform</title>
  <meta name="description" content="Sign in to your personalized UNLOST student workspace.">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="/src/firebase-init.ts"></script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; justify-content:center; background-color:var(--bg-pitch);">

  <div style="padding: 2rem 1.5rem; width: 100%; max-width: 440px; margin: auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="./index.html" class="unlost-logo" style="font-size: 2rem;">
        <span class="un">UN</span><span class="lost">LOST</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
        Sign in to your student workspace
      </p>
    </div>

    <div class="charcoal-card" style="padding: 2.25rem 2rem; box-shadow: 0 12px 36px rgba(0,0,0,0.6);">
      <div id="auth-alert" style="display:none; padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Student Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. aarav@student.in" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">Password</label>
            <a href="./forgot-password.html" style="font-size:0.78rem; color:var(--silver-metallic); text-decoration:underline;">Forgot Password?</a>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">
          <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="remember-me" checked style="accent-color:var(--silver-metallic); width:15px; height:15px;">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%; padding:0.8rem;">
          Sign In to UNLOST
        </button>

        <div style="display:flex; align-items:center; margin:1.25rem 0; gap:1rem;">
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
          <span style="font-size:0.75rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;">OR</span>
          <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
        </div>

        <button type="button" class="btn btn-secondary" id="google-login-btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.6rem; padding:0.75rem; font-size:0.875rem;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.6 6.3C.6 8.3 0 10.1 0 12s.6 3.7 1.6 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
          Continue with Google
        </button>

      </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: var(--text-muted); font-size: 0.88rem;">
        New student? <a href="./register.html" style="color: #ffffff; font-weight: 600; text-decoration: underline;">Create an account</a>
      </p>
      <div style="margin-top: 1.25rem;">
        <a href="./index.html" style="color: var(--text-dim); font-size: 0.8rem;">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = window.UnlostAuth.getCurrentUser();
      const params = new URLSearchParams(window.location.search);
      const redirectParam = params.get('redirect');

      if (currentUser && !redirectParam) {
        window.location.href = currentUser.role === 'admin' ? './admin.html' : './dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const rememberCheckbox = document.getElementById('remember-me');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('login-submit-btn');
      const googleBtn = document.getElementById('google-login-btn');

      // Password toggle
      document.getElementById('toggle-password').addEventListener('click', () => {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      });



      function showAlert(msg, isError = true) {
        alertBox.style.display = 'block';
        if (isError) {
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.border = '1px solid #ef4444';
          alertBox.style.color = '#fca5a5';
        } else {
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.border = '1px solid #10b981';
          alertBox.style.color = '#6ee7b7';
        }
        alertBox.textContent = msg;
      }

      // Email + Password Sign In
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        try {
          const user = await window.UnlostAuth.login(
            emailInput.value.trim(),
            passInput.value,
            rememberCheckbox.checked
          );

          if (!user.emailVerified) {
            showAlert('Your email address is not yet verified. Redirecting to verification screen...', false);
            setTimeout(() => {
              window.location.href = `./verify-email.html?email=${encodeURIComponent(user.email || '')}`;
            }, 600);
            return;
          }

          if (window.UnlostApp && typeof window.UnlostApp.showToast === 'function') {
            window.UnlostApp.showToast('Login successful. Redirecting...');
          }

          setTimeout(() => {
            if (redirectParam) {
              window.location.href = decodeURIComponent(redirectParam);
            } else if (user.email === 'k7286113@gmail.com' && user.emailVerified) {
              window.location.href = './admin.html';
            } else if (user.onboarded) {
              window.location.href = './dashboard.html';
            } else {
              window.location.href = './onboarding.html';
            }
          }, 400);
        } catch (err) {
          showAlert(err.message || 'Login failed. Please check your credentials.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to UNLOST';
        }
      });

      // Google Sign-In
      googleBtn.addEventListener('click', async () => {
        try {
          googleBtn.disabled = true;
          googleBtn.textContent = 'Signing in with Google...';
          const user = await window.UnlostAuth.loginWithGoogle();
          
          if (!user.emailVerified) {
            showAlert('Please verify your email address to continue.', false);
            setTimeout(() => {
              window.location.href = `./verify-email.html?email=${encodeURIComponent(user.email || '')}`;
            }, 600);
            return;
          }

          if (redirectParam) {
            window.location.href = decodeURIComponent(redirectParam);
          } else if (user.email === 'k7286113@gmail.com' && user.emailVerified) {
            window.location.href = './admin.html';
          } else {
            window.location.href = './dashboard.html';
          }
        } catch (err) {
          showAlert(err.message || 'Google Sign-In failed.');
          googleBtn.disabled = false;
          googleBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.6 6.3C.6 8.3 0 10.1 0 12s.6 3.7 1.6 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
            Continue with Google
          `;
        }
      });
    });
  </script>
</body>
</html>

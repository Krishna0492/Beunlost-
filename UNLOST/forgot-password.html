<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — UNLOST</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; justify-content:center; background-color:var(--bg-pitch);">

  <div style="padding: 2rem 1.5rem; width: 100%; max-width: 440px; margin: auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="./index.html" class="unlost-logo" style="font-size: 2rem;">
        <span class="un">UN</span><span class="lost">LOST</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
        Recover your student account access
      </p>
    </div>

    <div class="charcoal-card" style="padding: 2.25rem 2rem; box-shadow: 0 12px 36px rgba(0,0,0,0.6);">
      <div id="reset-alert" style="display:none; padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem;"></div>

      <!-- Step 1: Request OTP -->
      <form id="request-reset-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Registered Email Address</label>
          <input type="email" id="reset-email" class="form-input" placeholder="e.g. aarav@student.in" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary" id="reset-submit-btn" style="width:100%; padding:0.8rem; margin-top:0.5rem;">
          Send Recovery Code →
        </button>
      </form>

      <!-- Step 2: Enter OTP and New Password -->
      <div id="verify-reset-step" style="display:none;">
        <div style="background:rgba(255,255,255,0.04); border:1px solid var(--border-silver); border-radius:var(--radius-md); padding:0.85rem 1rem; margin-bottom:1.5rem; text-align:center;">
          <div style="font-size:0.75rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.25rem;">Simulated Email Dispatch</div>
          <div style="font-size:0.825rem; color:var(--text-muted); margin-bottom:0.4rem;">Your Recovery OTP:</div>
          <div id="display-reset-otp" style="font-size:1.5rem; font-weight:800; letter-spacing:0.25em; color:var(--silver-metallic); font-family:monospace;">------</div>
          <div style="font-size:0.75rem; color:var(--text-dim); margin-top:0.3rem;">Valid for 10 minutes</div>
        </div>

        <form id="verify-reset-form">
          <div class="form-group">
            <label class="form-label" for="reset-otp" style="text-align:center; display:block;">Enter 6-Digit Recovery Code</label>
            <input type="text" id="reset-otp" class="form-input" placeholder="• • • • • •" maxlength="6" pattern="[0-9]{6}" required style="text-align:center; font-size:1.4rem; letter-spacing:0.3em; font-family:monospace; max-width:240px; margin:0 auto; padding:0.6rem;">
          </div>

          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" class="form-input" placeholder="Re-enter new password" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary" id="save-new-pass-btn" style="width:100%; padding:0.8rem; margin-top:1rem;">
            Set New Password & Return to Login
          </button>
        </form>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: var(--text-muted); font-size: 0.88rem;">
        Remember your credentials? <a href="./login.html" style="color: #ffffff; font-weight: 600; text-decoration: underline;">Return to login</a>
      </p>
    </div>
  </div>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const reqForm = document.getElementById('request-reset-form');
      const verifyStep = document.getElementById('verify-reset-step');
      const verifyForm = document.getElementById('verify-reset-form');
      const emailInput = document.getElementById('reset-email');
      const otpInput = document.getElementById('reset-otp');
      const newPassInput = document.getElementById('new-password');
      const confirmPassInput = document.getElementById('confirm-new-password');
      const alertBox = document.getElementById('reset-alert');
      const resetBtn = document.getElementById('reset-submit-btn');
      const saveBtn = document.getElementById('save-new-pass-btn');
      const displayOtp = document.getElementById('display-reset-otp');

      let targetEmail = '';

      function showAlert(msg, isError = true) {
        alertBox.style.display = 'block';
        if (isError) {
          alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
          alertBox.style.border = '1px solid #ef4444';
          alertBox.style.color = '#fca5a5';
        } else {
          alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
          alertBox.style.border = '1px solid #10b981';
          alertBox.style.color = '#6ee7b7';
        }
        alertBox.textContent = msg;
      }

      function clearAlert() {
        alertBox.style.display = 'none';
      }

      reqForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();
        targetEmail = emailInput.value.trim();

        resetBtn.disabled = true;
        resetBtn.textContent = 'Generating recovery code...';

        try {
          const res = await window.UnlostAuth.requestPasswordReset(targetEmail);
          displayOtp.textContent = res.otp;
          reqForm.style.display = 'none';
          verifyStep.style.display = 'block';
          showAlert(`Recovery code generated for ${targetEmail}`, false);
          otpInput.focus();
        } catch (err) {
          showAlert(err.message);
          resetBtn.disabled = false;
          resetBtn.textContent = 'Send Recovery Code →';
        }
      });

      verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        if (newPassInput.value !== confirmPassInput.value) {
          showAlert('Passwords do not match. Please re-enter.');
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Updating password...';

        try {
          await window.UnlostAuth.verifyPasswordReset(targetEmail, otpInput.value.trim(), newPassInput.value);
          showAlert('Password updated successfully! Redirecting to login...', false);
          setTimeout(() => {
            window.location.href = './login.html';
          }, 1200);
        } catch (err) {
          showAlert(err.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Set New Password & Return to Login';
        }
      });
    });
  </script>
</body>
</html>

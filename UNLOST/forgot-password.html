<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — UNLOST</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; justify-content:center; background-color:var(--bg-pitch);">

  <div style="padding: 2rem 1.5rem; width: 100%; max-width: 440px; margin: auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="./index.html" class="unlost-logo" style="font-size: 2rem;">
        <span class="un">UN</span><span class="lost">LOST</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
        Recover your student account access
      </p>
    </div>

    <div class="charcoal-card" style="padding: 2.25rem 2rem; box-shadow: 0 12px 36px rgba(0,0,0,0.6);">
      <div id="reset-alert" style="display:none; padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Registered Email Address</label>
          <input type="email" id="reset-email" class="form-input" placeholder="e.g. aarav@student.in" required autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary" id="reset-submit-btn" style="width:100%; padding:0.8rem; margin-top:0.5rem;">
          Send Password Reset Link
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="color: var(--text-muted); font-size: 0.88rem;">
        Remember your credentials? <a href="./login.html" style="color: #ffffff; font-weight: 600; text-decoration: underline;">Return to login</a>
      </p>
    </div>
  </div>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const alertBox = document.getElementById('reset-alert');
      const btn = document.getElementById('reset-submit-btn');

      btn.disabled = true;
      btn.textContent = 'Sending reset instructions...';

      try {
        await window.UnlostAuth.requestPasswordReset(email);
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
        alertBox.style.border = '1px solid #10b981';
        alertBox.style.color = '#6ee7b7';
        alertBox.textContent = `Password reset email dispatched to ${email}. Check your inbox.`;
        btn.textContent = 'Link Sent';
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.border = '1px solid #ef4444';
        alertBox.style.color = '#fca5a5';
        alertBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Send Password Reset Link';
      }
    });
  </script>
</body>
</html>

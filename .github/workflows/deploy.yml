name: Deploy UNLOST to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build UNLOST Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Lint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_BASE: '/Beunlost-/'
          GITHUB_PAGES: 'true'

      - name: Verify Production Assets
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html missing" && exit 1)
          test -f dist/login.html || (echo "Error: dist/login.html missing" && exit 1)
          test -f dist/dashboard.html || (echo "Error: dist/dashboard.html missing" && exit 1)
          echo "Production build verified successfully!"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

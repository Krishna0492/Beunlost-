<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Details — UNLOST</title>
  <meta name="description" content="College overview, programs, entrance exams, and verified admission information.">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./index.html" class="unlost-logo">
          <span class="un">UN</span><span class="lost">LOST</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="./index.html" class="nav-link">Home</a></li>
            <li><a href="./career-explorer.html" class="nav-link">Explore Careers</a></li>
            <li><a href="./roadmaps.html" class="nav-link">Roadmaps</a></li>
            <li><a href="./skill-development.html" class="nav-link">Skills</a></li>
            <li><a href="./colleges.html" class="nav-link active">Colleges</a></li>
            <li><a href="./entrance-exams.html" class="nav-link">Exams</a></li>
            <li><a href="./scholarships.html" class="nav-link">Scholarships</a></li>
            <li><a href="./about.html" class="nav-link">About</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-actions">
        <a href="./login.html" class="btn btn-ghost btn-sm">Login</a>
        <a href="./register.html" class="btn btn-primary btn-sm">Get Started</a>
        <button class="menu-toggle" aria-label="Toggle Navigation">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main style="padding: 4rem 0 6rem;">
    <div class="container" id="college-details-content">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 UNLOST. Not lost. Just finding my way.</div>
        <div><a href="./colleges.html" style="color:var(--silver-metallic); text-decoration:underline;">Back to Colleges Directory</a></div>
      </div>
    </div>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'iit-bombay';
      const college = window.UNLOST_DATA.colleges.find(c => c.id === id) || window.UNLOST_DATA.colleges[0];
      const isSaved = window.UnlostApp.isSaved('colleges', college.id);

      document.title = `${college.name} — UNLOST College Profile`;
      const container = document.getElementById('college-details-content');

      const placement = college.placementStats;
      const branches = college.engineeringBranches || [];

      container.innerHTML = `
        <div style="margin-bottom: 2.5rem;">
          <a href="./colleges.html" style="color:var(--text-muted); font-size:0.85rem; display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to Colleges
          </a>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1.5rem;">
            <div>
              <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem; flex-wrap:wrap;">
                <span class="tag tag-silver">${college.institutionType || 'Autonomous'}</span>
                <span class="tag">${college.location}</span>
                ${college.nirfRank ? `<span class="tag tag-silver">NIRF: ${college.nirfRank}</span>` : ''}
              </div>
              <h1 class="section-title" style="margin-bottom:0.5rem;">${college.name}</h1>
              <p class="section-subtitle">${college.overview}</p>
            </div>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
              <button onclick="toggleSaveCollege('${college.id}', this)" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${isSaved ? 'white' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                ${isSaved ? 'Saved to Shortlist' : 'Save to Shortlist'}
              </button>
              <a href="${college.admissionPortal || college.officialWebsite}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Official Admission Portal ↗
              </a>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:2rem;">
          <div style="display:flex; flex-direction:column; gap:2rem;">

            ${placement ? `
              <div class="charcoal-card" style="border-left: 3px solid var(--silver-metallic);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                  <h3 class="card-title" style="margin:0;">Placement Track Record & Career Benchmarks</h3>
                  <span class="tag tag-silver" style="font-size:0.7rem;">Verified Data</span>
                </div>
                <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-subtle); padding:1rem; border-radius:var(--radius-md); margin-bottom:1rem;">
                  <div style="font-size:0.75rem; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.4rem;">Institutional Placement Performance</div>
                  <div style="font-size:1.05rem; font-weight:700; color:var(--silver-metallic); line-height:1.5;">
                    ${placement.highlight || `Median: ${placement.medianSalary || 'N/A'} • Highest Domestic: ${placement.highestDomestic || 'N/A'}`}
                  </div>
                </div>
                ${placement.topRecruiters ? `
                  <div style="margin-bottom:0.75rem;">
                    <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-dim); margin-bottom:0.35rem;">Major Marquee Recruiters</div>
                    <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                      ${placement.topRecruiters.map(r => `<span class="tag">${r}</span>`).join('')}
                    </div>
                  </div>
                ` : ''}
                <div style="font-size:0.75rem; color:var(--text-dim); margin-top:0.75rem;">
                  Source: <em>${placement.source || 'Official Placement Audit & NIRF Institutional Filing'}</em> (${placement.year || '2023-2024'})
                </div>
              </div>
            ` : ''}

            <div class="charcoal-card">
              <h3 class="card-title">Admission Process & Allocation Procedure</h3>
              <p style="color:var(--text-primary); font-size:0.95rem; line-height:1.6; margin-top:0.75rem;">
                ${college.admissionInfo}
              </p>
              ${college.applicationProcedure ? `
                <div style="margin-top:1rem; padding:1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-subtle); border-radius:var(--radius-md);">
                  <div style="font-size:0.8rem; font-weight:700; color:#ffffff; margin-bottom:0.35rem; text-transform:uppercase; letter-spacing:0.04em;">Official Application Procedure:</div>
                  <p style="font-size:0.875rem; color:var(--text-muted); line-height:1.6; margin:0;">
                    ${college.applicationProcedure}
                  </p>
                </div>
              ` : ''}
            </div>

            ${branches.length > 0 ? `
              <div class="charcoal-card">
                <h3 class="card-title">Engineering Disciplines & Departments</h3>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:0.6rem; margin-top:1rem;">
                  ${branches.map(b => `
                    <div style="padding:0.75rem 1rem; background:var(--bg-pitch); border:1px solid var(--border-subtle); border-radius:var(--radius-md); color:#ffffff; font-size:0.85rem; display:flex; align-items:center; gap:0.5rem;">
                      <span style="width:6px; height:6px; border-radius:50%; background:var(--silver-metallic);"></span>
                      ${b}
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="charcoal-card">
              <h3 class="card-title">Undergraduate & Graduate Degree Programs</h3>
              <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1rem;">
                ${college.courses.map(co => `<div style="padding:0.6rem 1rem; background:var(--bg-pitch); border:1px solid var(--border-subtle); border-radius:var(--radius-md); color:#ffffff; font-size:0.9rem;">${co}</div>`).join('')}
              </div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:2rem;">
            <div class="charcoal-card">
              <h3 class="card-title">Eligibility Criteria</h3>
              <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.75rem; line-height:1.6;">
                ${college.eligibility}
              </p>
            </div>

            ${college.feeInfo ? `
              <div class="charcoal-card">
                <h3 class="card-title">Estimated Academic Fee</h3>
                <div style="font-size:1.15rem; font-weight:700; color:var(--silver-metallic); margin-top:0.5rem;">
                  ${college.feeInfo}
                </div>
                ${college.scholarshipsInfo ? `
                  <div style="margin-top:0.75rem; font-size:0.825rem; color:var(--text-muted); line-height:1.5;">
                    <strong style="color:#ffffff;">Fee Concessions:</strong> ${college.scholarshipsInfo}
                  </div>
                ` : ''}
              </div>
            ` : ''}

            <div class="charcoal-card">
              <h3 class="card-title">Accepted Entrance Examinations</h3>
              <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:1rem;">
                ${college.entranceExams.map(ex => `
                  <div style="padding:0.65rem 0.85rem; background:var(--bg-pitch); border-radius:var(--radius-md); font-size:0.88rem; color:#ffffff;">
                    ${ex}
                  </div>
                `).join('')}
              </div>
              <a href="./entrance-exams.html" class="btn btn-outline btn-sm" style="margin-top:1rem; width:100%;">View Exam Schedules</a>
            </div>
          </div>
        </div>
      `;

      window.toggleSaveCollege = (cid, btn) => {
        const isNowSaved = window.UnlostApp.toggleBookmark('colleges', cid);
        const svg = btn.querySelector('svg');
        if (svg) svg.setAttribute('fill', isNowSaved ? 'white' : 'none');
        btn.textContent = isNowSaved ? 'Saved to Shortlist' : 'Save to Shortlist';
      };
    });
  </script>
</body>
</html>

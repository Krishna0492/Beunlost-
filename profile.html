<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile — UNLOST</title>
  <meta name="description" content="Manage your student profile, academic stream, and educational preferences.">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="/src/firebase-init.ts"></script>
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./index.html" class="unlost-logo">
          <span class="un">UN</span><span class="lost">LOST</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="./dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="./career-explorer.html" class="nav-link">Explore Careers</a></li>
            <li><a href="./roadmaps.html" class="nav-link">Roadmaps</a></li>
            <li><a href="./progress.html" class="nav-link">My Progress</a></li>
            <li><a href="./profile.html" class="nav-link active">Profile</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-actions">
        <a href="./dashboard.html" class="btn btn-outline btn-sm">Workspace</a>
        <button onclick="window.UnlostAuth.logout()" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <main style="padding: 4rem 0 6rem;">
    <div class="container-narrow">
      <div style="display:flex; align-items:center; gap:1.5rem; margin-bottom: 2.5rem; flex-wrap:wrap;">
        <div class="student-avatar" style="width:72px; height:72px; font-size:1.75rem;">ST</div>
        <div>
          <h1 class="section-title" id="display-profile-name" style="margin-bottom:0.25rem;">Student User</h1>
          <p id="display-profile-stream" style="color:var(--text-muted); font-size:0.95rem;">High School (11th-12th) • Science (PCM)</p>
        </div>
      </div>

      <div class="charcoal-card" style="padding: 2.5rem 2rem;">
        <form id="profile-edit-form">
          <h2 class="card-title" style="margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-subtle);">
            Edit Student Details
          </h2>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prof-name">Full Name</label>
              <input type="text" id="prof-name" class="form-input" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-email">Email Address</label>
              <input type="email" id="prof-email" class="form-input" disabled style="opacity:0.6; cursor:not-allowed;">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prof-level">Education Level</label>
              <input type="text" id="prof-level" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-class">Current Class / Year</label>
              <input type="text" id="prof-class" class="form-input">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prof-country">Country</label>
              <input type="text" id="prof-country" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-state">State / Region</label>
              <input type="text" id="prof-state" class="form-input">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prof-stream">Academic Stream</label>
              <input type="text" id="prof-stream" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-board">Board / University</label>
              <input type="text" id="prof-board" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="prof-subjects">Subjects</label>
            <input type="text" id="prof-subjects" class="form-input">
          </div>

          <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="prof-style">Preferred Learning Style</label>
              <input type="text" id="prof-style" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-hours">Weekly Target Hours</label>
              <input type="number" id="prof-hours" class="form-input" min="1" max="80">
            </div>
          </div>

          <div style="margin-top: 1.5rem; display:flex; justify-content:flex-end; gap:0.75rem;">
            <a href="./dashboard.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 UNLOST. Not lost. Just finding my way.</div>
        <div><a href="./settings.html" style="color:var(--silver-metallic); text-decoration:underline;">Account Settings</a></div>
      </div>
    </div>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.UnlostProfile.initProfilePage();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Details — UNLOST</title>
  <meta name="description" content="Verified scholarship information, grant amounts, eligibility, and official application portals.">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="/src/firebase-init.ts"></script>
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="./index.html" class="unlost-logo">
          <span class="un">UN</span><span class="lost">LOST</span>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="./index.html" class="nav-link">Home</a></li>
            <li><a href="./career-explorer.html" class="nav-link">Explore Careers</a></li>
            <li><a href="./roadmaps.html" class="nav-link">Roadmaps</a></li>
            <li><a href="./skill-development.html" class="nav-link">Skills</a></li>
            <li><a href="./colleges.html" class="nav-link">Colleges</a></li>
            <li><a href="./entrance-exams.html" class="nav-link">Exams</a></li>
            <li><a href="./scholarships.html" class="nav-link active">Scholarships</a></li>
            <li><a href="./about.html" class="nav-link">About</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-actions">
        <a href="./login.html" class="btn btn-ghost btn-sm">Login</a>
        <a href="./register.html" class="btn btn-primary btn-sm">Get Started</a>
        <button class="menu-toggle" aria-label="Toggle Navigation">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main style="padding: 4rem 0 6rem;">
    <div class="container" id="scholarship-details-content">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 UNLOST. Not lost. Just finding my way.</div>
        <div><a href="./scholarships.html" style="color:var(--silver-metallic); text-decoration:underline;">Back to Scholarships</a></div>
      </div>
    </div>
  </footer>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'inspire-dst';
      const scholarship = window.UNLOST_DATA.scholarships.find(s => s.id === id) || window.UNLOST_DATA.scholarships[0];
      const isSaved = window.UnlostApp.isSaved('scholarships', scholarship.id);

      document.title = `${scholarship.name} — UNLOST Aid`;
      const container = document.getElementById('scholarship-details-content');

      container.innerHTML = `
        <div style="margin-bottom: 2.5rem;">
          <a href="./scholarships.html" style="color:var(--text-muted); font-size:0.85rem; display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to Scholarships
          </a>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1.5rem;">
            <div>
              <span class="tag tag-silver" style="margin-bottom:0.5rem;">${scholarship.educationLevel}</span>
              <h1 class="section-title" style="margin-bottom:0.5rem;">${scholarship.name}</h1>
              <p class="section-subtitle">${scholarship.provider}</p>
            </div>
            <div style="display:flex; gap:0.75rem;">
              <button onclick="toggleSaveScholarship('${scholarship.id}', this)" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="${isSaved ? 'white' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                ${isSaved ? 'Saved' : 'Save Scholarship'}
              </button>
              <a href="${scholarship.officialUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Official Application Portal ↗
              </a>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:2rem;">
          <div class="charcoal-card">
            <h3 class="card-title">Award Grant & Support</h3>
            <div style="font-size:1.5rem; font-weight:800; color:#ffffff; margin:0.75rem 0;">${scholarship.amount}</div>
            <p style="color:var(--text-muted); font-size:0.95rem; line-height:1.6;">
              Funding provided directly to eligible scholars to cover university tuition, study materials, research mentorship, and living expenses.
            </p>
          </div>

          <div class="charcoal-card">
            <h3 class="card-title">Eligibility Requirements</h3>
            <p style="color:var(--text-primary); font-size:0.95rem; margin-top:0.75rem; line-height:1.5;">
              ${scholarship.eligibility}
            </p>
            <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border-subtle); color:var(--text-muted); font-size:0.85rem;">
              <strong>Application Schedule:</strong> ${scholarship.applicationPeriod}
            </div>
          </div>
        </div>
      `;

      window.toggleSaveScholarship = (sid, btn) => {
        const isNowSaved = window.UnlostApp.toggleBookmark('scholarships', sid);
        const svg = btn.querySelector('svg');
        if (svg) svg.setAttribute('fill', isNowSaved ? 'white' : 'none');
        btn.textContent = isNowSaved ? 'Saved' : 'Save Scholarship';
      };
    });
  </script>
</body>
</html>
